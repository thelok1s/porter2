# Porter2 production container.
#
# Env: put your real tokens in `.env` (gitignored) next to this file — the same
# shape as `.env.example`. compose injects it via env_file. For prod, at minimum
# set:
#   PORTER_API_KEY=<strong random>          # must match Vercel NEXT_PUBLIC_PORTER_API_KEY
#   PORTER_PUBLIC_URL=https://porter.prod.lok1s.tech   # Telegram fetches /uploads from here
#   TMA_PUBLIC_URL=https://frog.prod.lok1s.tech        # the Mini App URL
#   PORTER_API_PORT=5050                    # must match the published port below
#
# Networking: the published port is reachable on the host's LAN + tailnet IPs.
# The host is behind NAT, so it is NOT internet-facing; the only public point is
# the edge proxy on `nether`, which is where auth/rate-limit/IP-allowlisting run.
# To bind only to the tailnet interface, set PORTER_BIND to that IP (e.g. 100.64.0.x)
# via the host environment or a .env on the Docker host.

services:
  porter2:
    build: .
    image: porter2:latest
    container_name: porter2
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORTER_BIND:-0.0.0.0}:5050:5050"
    volumes:
      # SQLite DB + MTProto session — do not lose these across restarts.
      - ./db:/app/db
      # Uploaded images served at ${PORTER_PUBLIC_URL}/uploads/*
      - ./uploads:/app/uploads
    healthcheck:
      # /health is unauthenticated and returns JSON {status:"ok"}.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
